# ============================================================
# Docker profile — overrides application.properties for Docker
# Service names match the docker-compose.yml service names
# ============================================================

server.port=8080

# PostgreSQL — "postgres" is the Docker Compose service name
spring.datasource.url=jdbc:postgresql://postgres:5432/ocms_db
spring.datasource.username=ocms_user
spring.datasource.password=ocms_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# File Upload Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Redis — "redis" is the Docker Compose service name
spring.data.redis.host=redis
spring.data.redis.port=6379

# SMTP Mail Config (update credentials before production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
